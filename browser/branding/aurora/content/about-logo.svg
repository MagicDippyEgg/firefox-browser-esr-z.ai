<!-- Vela wordmark — sail-and-horizon logomark with the Vela wordmark.
     Original artwork for the Vela browser. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Vela">
  <defs>
    <linearGradient id="vela-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFAF3"/>
      <stop offset="1" stop-color="#F1E6D2"/>
    </linearGradient>
    <linearGradient id="vela-sail" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#E07856"/>
      <stop offset="1" stop-color="#C8553D"/>
    </linearGradient>
    <linearGradient id="vela-sail-shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C3B2A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9C3B2A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vela-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D5F5D"/>
      <stop offset="1" stop-color="#1F4444"/>
    </linearGradient>
    <radialGradient id="vela-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="0.6" stop-color="#F2B980" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#F2B980" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background tile (warm parchment) -->
  <rect width="512" height="512" rx="96" fill="url(#vela-sky)"/>

  <!-- Soft sun behind the sail -->
  <circle cx="320" cy="210" r="120" fill="url(#vela-sun)"/>

  <!-- The sail — a single billowing triangle, the Vela constellation's namesake -->
  <path d="M 196 96 C 196 96 196 96 200 100
           C 240 160 280 240 320 330
           C 322 336 320 342 312 342
           L 200 342
           C 192 342 188 336 188 328
           L 188 104
           C 188 99 192 96 196 96 Z"
        fill="url(#vela-sail)"/>
  <!-- Sail shadow fold -->
  <path d="M 196 100 C 230 160 270 240 310 330 L 200 330 L 200 100 Z"
        fill="url(#vela-sail-shadow)"/>
  <!-- Mast -->
  <rect x="184" y="88" width="6" height="262" rx="3" fill="#3A2C20"/>

  <!-- Horizon line / sea -->
  <path d="M 0 360 Q 128 348 256 360 T 512 360 L 512 512 L 0 512 Z" fill="url(#vela-sea)"/>
  <!-- Wave highlights -->
  <path d="M 0 376 Q 128 366 256 376 T 512 376"
        stroke="#7FB0AC" stroke-width="2" fill="none" opacity="0.55"/>
  <path d="M 0 396 Q 128 388 256 396 T 512 396"
        stroke="#7FB0AC" stroke-width="1.5" fill="none" opacity="0.35"/>

  <!-- Three small stars of the Vela constellation above the sail -->
  <g fill="#1F1B16">
    <circle cx="384" cy="96" r="4"/>
    <circle cx="416" cy="124" r="3"/>
    <circle cx="396" cy="146" r="2.5"/>
  </g>
  <g stroke="#1F1B16" stroke-width="1" opacity="0.4">
    <line x1="384" y1="96" x2="416" y2="124"/>
    <line x1="416" y1="124" x2="396" y2="146"/>
  </g>
</svg>
