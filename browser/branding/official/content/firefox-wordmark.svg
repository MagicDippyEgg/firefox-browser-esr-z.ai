<!-- Vela wordmark — original typographic logo for the Vela browser. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Vela">
  <defs>
    <linearGradient id="vw-sail" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#E07856"/>
      <stop offset="1" stop-color="#C8553D"/>
    </linearGradient>
  </defs>
  <!-- Small sail mark beside the wordmark -->
  <g transform="translate(8 12)">
    <path d="M 22 8 C 22 8 22 8 26 12 C 36 24 46 40 54 56 C 55 58 54 60 50 60 L 22 60 C 18 60 16 58 16 54 L 16 12 C 16 9 18 8 22 8 Z" fill="url(#vw-sail)"/>
    <rect x="14" y="6" width="4" height="56" rx="2" fill="#3A2C20"/>
  </g>
  <!-- Wordmark text -->
  <text x="84" y="56"
        font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="600" letter-spacing="-1"
        fill="context-fill #1F1B16">Vela</text>
</svg>
