<!-- Vela Harbor icon — a stylised harbour breakwater with a small boat
     sheltered inside. Used as the sidebar switcher icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Harbor">
  <!-- Breakwater arc -->
  <path d="M 2 11 Q 8 1 14 11" fill="none" stroke="context-fill #2D5F5D" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sea line -->
  <path d="M 1 12.5 L 15 12.5" stroke="context-fill #2D5F5D" stroke-width="1" opacity="0.5"/>
  <!-- Small boat (sail) -->
  <path d="M 7 6 L 7 10 L 9.5 10 Z" fill="context-fill #C8553D"/>
  <rect x="6.7" y="5.5" width="0.6" height="5" fill="context-fill #1F1B16"/>
  <!-- Boat hull -->
  <path d="M 6 11 Q 8 12 10 11" fill="none" stroke="context-fill #1F1B16" stroke-width="0.8" stroke-linecap="round"/>
</svg>
