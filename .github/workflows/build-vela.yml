# Vela — GitHub Actions build workflow.
#
# Builds the Vela browser from source on a standard GitHub-hosted Ubuntu
# runner, packages it, and uploads the result as a downloadable artifact.
#
# Why a standard runner is enough:
#   - The standard ubuntu-22.04/24.04 runner has 4 vCPU, 16 GB RAM, and
#     ~84 GB of disk (after freeing the preinstalled Android/.NET/Haskell
#     toolchains that we don't need). Firefox needs ~30 GB free and ~8 GB
#     RAM minimum. We add a 16 GB swap file to absorb the spike during the
#     Rust compilation phase, and we cap parallelism at -j2 to stay within
#     RAM. The result is a complete, real Vela build — not a stub.
#
# Build time on a cold cache: ~2h30m–3h30m. With sccache warm: ~30–60m.
# The 6-hour job timeout leaves comfortable headroom.
#
# Triggers:
#   - workflow_dispatch        (manual "Run workflow" button)
#   - push to main / tags v*   (auto-build on release tags)
#   - release (published)      (auto-build when a GitHub release is published)
#
# Artifact:
#   - The packaged browser is uploaded as a workflow artifact named
#     `vela-browser-linux-x86_64` and is downloadable from the workflow
#     run's summary page for 90 days.

name: Build Vela

on:
  workflow_dispatch:
    inputs:
      debug_build:
        description: "Build a debug build (slower, larger, with assertions)"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

# Cancel any in-flight build for the same ref when a new push lands.
concurrency:
  group: build-vela-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vela (Linux x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      # ---------------------------------------------------------------- *
      # 1. Free up disk space on the runner.
      #
      #    The ubuntu-22.04 image ships with ~30 GB of preinstalled
      #    toolchains (Android SDK, .NET, Haskell, multiple JDKs, etc.)
      #    that Firefox doesn't need. Removing them reclaims enough space
      #    for the build's ~30 GB working set.
      # ---------------------------------------------------------------- *
      - name: Free up disk space on the runner
        run: |
          set -eux
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo df -h /

          # Remove large preinstalled toolchains we don't need.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /usr/local/share/ghc \
            /usr/local/share/.ghc \
            /opt/ghc \
            /opt/cabal \
            /opt/haskell \
            /usr/local/share/openssl \
            /usr/local/wpm \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/lib/firefox \
            /usr/share/miniconda \
            /opt/microsoft \
            /opt/pipx \
            /usr/share/az_9.3 \
            /usr/share/az_10 \
            /usr/share/rust \
            /usr/local/kotlin \
            /usr/local/konan \
            /usr/lib/jvm \
            /usr/lib/mono \
            /usr/lib/postgresql \
            /usr/lib/mysql \
            /usr/share/swift \
            /usr/local/graalvm \
            /usr/local/jvm \
            /usr/local/share/Chromium \
            /usr/local/share/chromedriver \
            /usr/local/share/edge \
            /usr/local/share/edge-driver \
            /usr/lib/google-cloud-sdk \
            /usr/lib/google-cloud-cli \
            /usr/lib/kubectl \
            /usr/local/share/phantomjs* \
            /usr/local/share/vcpkg \
            2>/dev/null || true

          # Remove Docker images (we don't use Docker for the build).
          sudo docker image prune -af 2>/dev/null || true
          sudo docker system prune -af --volumes 2>/dev/null || true

          # Remove apt packages we don't need.
          sudo apt-get purge -y \
            azure-cli google-chrome-stable microsoft-edge-stable \
            firefox postgresql* mysql* dotnet* mono-* \
            ghc haskell-platform cabal-install \
            2>/dev/null || true
          sudo apt-get autoremove -y --purge 2>/dev/null || true

          echo "=== Disk usage after cleanup ==="
          df -h /

      # ---------------------------------------------------------------- *
      # 2. Add swap (if needed).
      #
      #    The ubuntu-22.04 runner ships with ~3 GB of swap and 16 GB RAM.
      #    Firefox's Rust compilation phase can briefly exceed available
      #    RAM, so we add a 12 GB swap file as a safety net. We use a
      #    unique filename (/vela-swap) to avoid colliding with the
      #    runner's pre-existing /swapfile.
      # ---------------------------------------------------------------- *
      - name: Add swap (if needed)
        run: |
          set -eux
          # Show what's already there.
          free -h || true
          swapon --show || true
          # Add our own swap file on top of whatever's already configured.
          if [ ! -f /vela-swap ]; then
            sudo fallocate -l 12G /vela-swap || sudo dd if=/dev/zero of=/vela-swap bs=1M count=12288
            sudo chmod 600 /vela-swap
            sudo mkswap /vela-swap
            sudo swapon /vela-swap || true
          fi
          free -h
          swapon --show || true

      # ---------------------------------------------------------------- *
      # 3. Check out the repository.
      # ---------------------------------------------------------------- *
      - name: Checkout Vela source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------- *
      # 4. Install Mozilla build dependencies.
      #
      #    `./mach bootstrap` is Mozilla's official dependency installer.
      #    It installs Rust, the clang toolchain, Node.js, and all the
      #    system libraries Firefox needs. We answer "yes" to all
      #    prompts via `--no-interactive` and pick the Firefox for
      #    Desktop (browser) project.
      # ---------------------------------------------------------------- *
      - name: Install Mozilla build dependencies
        run: |
          set -eux
          # Baseline packages that bootstrap.py expects to be able to find.
          sudo apt-get update
          sudo apt-get install -y \
            curl python3 python3-venv python3-dev git make \
            pkg-config libdbus-1-dev libdrm-dev \
            libgtk-3-dev libglib2.0-dev libnss3-dev libnspr4-dev \
            libasound2-dev libpulse-dev \
            libx11-xcb-dev libxtst-dev libxrandr-dev \
            libxss-dev libxcursor-dev libxcomposite-dev \
            libxdamage-dev libxinerama-dev libxi-dev \
            libpango1.0-dev libcairo2-dev \
            libgconf-2-4 libgconf2-dev 2>/dev/null || true
          # Watchman (file watcher, used by mach).
          sudo apt-get install -y watchman 2>/dev/null || true

          # Run Mozilla's bootstrap. --no-interactive picks the defaults
          # suitable for the chosen application; we set MOZ_BOOTSTRAP=1 to
          # signal non-interactive mode.
          MOZ_BOOTSTRAP=1 ./mach --no-interactive bootstrap --application-choice browser

      # ---------------------------------------------------------------- *
      # 5. Configure sccache.
      #
      #    sccache caches C/C++/Rust compilations. Combined with the
      #    actions/cache step below, this turns the second build into a
      #    30–60 minute job instead of a 3 hour one.
      # ---------------------------------------------------------------- *
      - name: Install sccache
        env:
          SCCACHE_VERSION: "0.8.2"
        run: |
          set -eux
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  SCCACHE_ARCH="x86_64";;
            aarch64) SCCACHE_ARCH="aarch64";;
            *) echo "Unsupported arch: $ARCH"; exit 1;;
          esac
          URL="https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-${ARCH}-unknown-linux-musl.tar.gz"
          curl -fsSL "$URL" | sudo tar -xz --strip-components=1 -C /usr/local/bin sccache-v${SCCACHE_VERSION}-${ARCH}-unknown-linux-musl/sccache
          sudo chmod +x /usr/local/bin/sccache
          sccache --version
          # Start sccache server in background.
          sccache --start-server || true

      - name: Cache sccache artifacts
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/sccache
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
          key: vela-sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            vela-sccache-${{ runner.os }}-

      # ---------------------------------------------------------------- *
      # 6. Write the mozconfig.
      # ---------------------------------------------------------------- *
      - name: Install Vela mozconfig
        run: |
          set -eux
          cp build/vela/mozconfig mozconfig
          # For a debug build (manual trigger with debug_build=true), append overrides.
          if [ "${{ github.event.inputs.debug_build }}" = "true" ]; then
            {
              echo ""
              echo "# Debug overrides (workflow_dispatch with debug_build=true)."
              echo "ac_add_options --enable-debug"
              echo "ac_add_options --disable-optimize"
              echo "unset RUSTC_OPT_LEVEL"
            } >> mozconfig
          fi
          echo "=== mozconfig ==="
          cat mozconfig

      # ---------------------------------------------------------------- *
      # 6b. Fetch the Breakpad linux_syscall_support.h header.
      #
      #     Breakpad's memory_allocator.h (used by both the crashreporter
      #     and the Gecko profiler) #includes "third_party/lss/linux_syscall_support.h".
      #     Mozilla's bootstrap is supposed to fetch this header but
      #     frequently doesn't on CI. We fetch it directly from Google's
      #     chromium.googlesource.com/linux-syscall-support repo (the
      #     official source) as a single base64-encoded file and decode it.
      # ---------------------------------------------------------------- *
      - name: Fetch Breakpad linux_syscall_support.h
        run: |
          set -eux
          LSS_DIR="toolkit/crashreporter/google-breakpad/src/third_party/lss"
          mkdir -p "$LSS_DIR"
          # Google's official linux-syscall-support repo. The file is at
          # the repo root (not in lss/). googlesource returns base64 when
          # ?format=TEXT is appended.
          curl -fsSL "https://chromium.googlesource.com/linux-syscall-support/+/refs/heads/main/linux_syscall_support.h?format=TEXT" \
            | base64 -d > "$LSS_DIR/linux_syscall_support.h"
          echo "Fetched linux_syscall_support.h:"
          ls -la "$LSS_DIR/linux_syscall_support.h"
          echo "First 5 lines:"
          head -5 "$LSS_DIR/linux_syscall_support.h"

      # ---------------------------------------------------------------- *
      # 7. Configure.
      # ---------------------------------------------------------------- *
      - name: Configure the build
        run: |
          set -eux
          # MOZCONFIG is read by mach; the default is ./mozconfig which we just installed.
          ./mach configure

      # ---------------------------------------------------------------- *
      # 8. Build.
      #
      #    We cap parallelism at -j3 (4 vCPU minus 1 for the mach/python
      #    overhead). With 16 GB RAM + 16 GB swap, -j3 is the sweet spot
      #    for not OOMing while still using the available cores.
      # ---------------------------------------------------------------- *
      - name: Build Vela
        env:
          SCCACHE_DIRECT: "false"
          SCCACHE_IDLE_TIMEOUT: "0"
          RUSTC_WRAPPER: sccache
          CARGO_INCREMENTAL: "0"
          MOZ_BUILD_HOOK: ""
        run: |
          set -eux
          ./mach build --jobs 3
          # Print sccache stats so we can see the cache hit rate in the log.
          sccache --show-stats || true

      # ---------------------------------------------------------------- *
      # 9. Package.
      #
      #    `./mach package` produces obj-vela/dist/vela-*.tar.bz2 (and a
      #    vela-*.txt manifest). We'll package the whole dist directory
      #    so the user gets a runnable browser.
      # ---------------------------------------------------------------- *
      - name: Package Vela
        run: |
          set -eux
          ./mach package
          echo "=== dist directory ==="
          ls -lh obj-vela/dist/ | head -40
          echo "=== packaged archives ==="
          ls -lh obj-vela/dist/*.tar.* obj-vela/dist/*.zip 2>/dev/null || true

      # ---------------------------------------------------------------- *
      # 10. Stage the artifact.
      #
      #     `./mach package` produces a properly-packaged tarball at
      #     obj-vela/dist/vela-<version>.en-US.linux-x86_64.tar.xz that
      #     contains REAL FILES (not build-tree symlinks). We extract
      #     that tarball into the staging directory, add a README and
      #     a dependencies.txt, then re-tar.
      #
      #     IMPORTANT: do NOT copy obj-vela/dist/bin directly — that
      #     directory is the build tree and is full of symlinks pointing
      #     to /home/runner/work/... source paths that don't exist on
      #     the user's machine. Those dangling symlinks cause
      #     "Couldn't load XPCOM" at startup.
      # ---------------------------------------------------------------- *
      - name: Stage artifact
        run: |
          set -eux
          STAGE="$RUNNER_TEMP/vela-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # Find the packaged tarball produced by `./mach package`.
          # It's named like vela-<version>.en-US.linux-x86_64.tar.xz
          # and contains REAL FILES (not build-tree symlinks).
          PKG_TARBALL=$(ls obj-vela/dist/vela-*.en-US.linux-x86_64.tar.xz | head -1)
          echo "Packaged tarball: $PKG_TARBALL"
          ls -lh "$PKG_TARBALL"

          # Extract the packaged tarball into the staging directory.
          # This gives us a self-contained `vela/` directory with real
          # files — no dangling symlinks.
          tar -C "$STAGE" -xf "$PKG_TARBALL"

          # CRITICAL: verify there are no dangling symlinks. The build
          # tree (dist/bin) has thousands of symlinks pointing to source
          # paths that don't exist on the user's machine. The packaged
          # tarball should have real files. If we see dangling symlinks
          # here, something is wrong with the packaging.
          echo "=== Checking for dangling symlinks ==="
          DANGLING_COUNT=$(find "$STAGE/vela" -type l ! -exec test -e {} \; -print | wc -l)
          if [ "$DANGLING_COUNT" -gt 0 ]; then
            echo "ERROR: $DANGLING_COUNT dangling symlinks found in packaged tarball!"
            find "$STAGE/vela" -type l ! -exec test -e {} \; -print | head -10
            echo "This should not happen — ./mach package should produce real files."
            exit 1
          fi
          echo "OK: no dangling symlinks."

          # Run ldd on the main binary and on libxul.so to detect any
          # missing / not-found dependencies on the BUILD machine. This
          # is informational — the user's machine may have different
          # packages installed.
          echo "=== ldd vela (build machine) ===" > "$STAGE/dependencies.txt"
          ldd "$STAGE/vela/vela" >> "$STAGE/dependencies.txt" 2>&1 || true
          echo "" >> "$STAGE/dependencies.txt"
          echo "=== ldd libxul.so (build machine) ===" >> "$STAGE/dependencies.txt"
          ldd "$STAGE/vela/libxul.so" >> "$STAGE/dependencies.txt" 2>&1 || true
          echo "" >> "$STAGE/dependencies.txt"
          echo "=== NEEDED entries (objdump -p vela) ===" >> "$STAGE/dependencies.txt"
          objdump -p "$STAGE/vela/vela" | grep NEEDED >> "$STAGE/dependencies.txt" 2>&1 || true
          echo "" >> "$STAGE/dependencies.txt"
          echo "=== NEEDED entries (objdump -p libxul.so) ===" >> "$STAGE/dependencies.txt"
          objdump -p "$STAGE/vela/libxul.so" | grep NEEDED >> "$STAGE/dependencies.txt" 2>&1 || true

          # Check for any "not found" entries — those are the missing libs
          # that would cause "Couldn't load XPCOM" on the user's machine.
          MISSING=$(grep "not found" "$STAGE/dependencies.txt" || true)
          if [ -n "$MISSING" ]; then
            echo "WARNING: Missing libraries detected on build machine:"
            echo "$MISSING"
          fi

          # Write the run README with system-dependency instructions.
          cat > "$STAGE/README.txt" <<'EOF'
          Vela — the calm browser.
          Built from source by GitHub Actions.

          ─────────────────────────────────────────────────────────────
          TO RUN
          ─────────────────────────────────────────────────────────────

            ./vela/vela                          # launches Vela
            ./vela/vela --new-tab about:vela     # opens the Vela welcome page

          ─────────────────────────────────────────────────────────────
          IF YOU GET "Couldn't load XPCOM"
          ─────────────────────────────────────────────────────────────

          That error means Vela can't find a system library it needs.
          Install the runtime dependencies:

            # Ubuntu / Debian:
            sudo apt update
            sudo apt install -y \
              libgtk-3-0 libdbus-glib-1-2 libxt6 libasound2 \
              libnss3 libstdc++6 libgcc-s1 \
              libpango-1.0-0 libcairo2 libfreetype6 libfontconfig1 \
              libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxdamage1 \
              libxext6 libxfixes3 libxrandr2 libxrender1 libxtst6 \
              libglib2.0-0 libatk1.0-0 libatk-bridge2.0-0 libepoxy0 \
              libwayland-client0 libwayland-server0 libgbm1

            # Fedora / RHEL:
            sudo dnf install -y \
              gtk3 dbus-glib libXt alsa-lib nss \
              pango cairo freetype fontconfig \
              libX11 libX11-xcb libxcb libXcomposite libXdamage \
              libXext libXfixes libXrandr libXrender libXtst \
              glib2 atk at-spi2-atk libepoxy mesa-libgbm

          On newer Ubuntu (24.04+), the package is `libasound2t64`
          instead of `libasound2`.

          See `dependencies.txt` in this archive for the full ldd output
          from the build machine.

          ─────────────────────────────────────────────────────────────
          ABOUT VELA
          ─────────────────────────────────────────────────────────────

          Vela is a fork of Mozilla Firefox ESR. It preserves full web
          compatibility and all of Firefox's underlying browser engine.

          Original features (keyboard shortcuts):
            Ctrl+Shift+F       Focus Mode — hide all chrome
            Ctrl+Alt+H         Harbor sidebar — bookmarks/history/downloads/reading list/notes
            Ctrl+Shift+G       New Tide — collapsible tab group
            Ctrl+Alt+R         Sepia Reader — warm sepia tint with typography controls
            Ctrl+Alt+W         Workspaces — saved tab sessions
            Ctrl+Alt+Shift+L   Add to Reading List
            Ctrl+Alt+V         About Vela — settings hub

          For the full design document, see docs/vela/DESIGN.md in the
          source repository:
          https://github.com/MagicDippyEgg/firefox-browser-esr-z.ai
          EOF
          # Tarball it.
          TAR_NAME="vela-browser-linux-x86_64-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}.tar.xz"
          tar -C "$STAGE" -cJf "$RUNNER_TEMP/$TAR_NAME" vela README.txt dependencies.txt
          ls -lh "$RUNNER_TEMP/$TAR_NAME"
          echo "TAR_NAME=$TAR_NAME" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- *
      # 11. Upload the artifact.
      # ---------------------------------------------------------------- *
      - name: Upload Vela artifact
        uses: actions/upload-artifact@v4
        with:
          name: vela-browser-linux-x86_64
          path: ${{ runner.temp }}/${{ env.TAR_NAME }}
          retention-days: 90
          compression-level: 0  # already xz-compressed

      # ---------------------------------------------------------------- *
      # 12. Diagnostics on failure.
      # ---------------------------------------------------------------- *
      - name: Diagnostics — config.log tail
        if: failure()
        run: |
          echo "=== tail of obj-vela/config.log ==="
          tail -200 obj-vela/config.log 2>/dev/null || echo "(no config.log)"
          echo "=== disk usage at failure ==="
          df -h /
          echo "=== memory at failure ==="
          free -h
          echo "=== sccache stats ==="
          sccache --show-stats 2>/dev/null || true

      - name: Diagnostics — upload full build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vela-build-logs-failure
          path: |
            obj-vela/config.log
            obj-vela/mozinfo.json
          retention-days: 14
          if-no-files-found: ignore
